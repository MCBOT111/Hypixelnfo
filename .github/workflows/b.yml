name: Twitch 自动注册

on:
  # 手动触发（只需要设置Job数量和前端IP，每个Job固定注册20个账号）
  workflow_dispatch:
    inputs:
      jobs:
        description: "并行 GitHub Job 数（多个 runner 同时跑，每个Job注册20个账号）"
        required: false
        default: "1"
      front_ip:
        description: "前端管理系统 IP（如 8.138.198.37）"
        required: false
        default: "8.138.198.37"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      per_job: ${{ steps.gen.outputs.per_job }}
    steps:
      - name: 生成并行 matrix
        id: gen
        run: |
          njobs="${{ github.event.inputs.jobs || '1' }}"
          # 每个Job固定注册20个账号
          PER_JOB=20
          python3 -c "
          import json
          j = max(1, int('$njobs'))
          print('matrix=' + json.dumps(list(range(j))))
          print('per_job=' + str($PER_JOB))
          " >> "$GITHUB_OUTPUT"

  register:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        job_index: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      # 强制 Python 使用 UTF-8，避免 Windows CI 把中文日志转义成 \uXXXX
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: 拉取私人仓库主程序
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_TOKEN }}
          path: app

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖与浏览器
        run: |
          cd app
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m patchright install chromium

      - name: 运行注册 (Job ${{ matrix.job_index }})
        env:
          # 每个 Job 固定注册20个账号
          REGISTER_COUNT: ${{ needs.prepare.outputs.per_job }}
          # 每个 Job 内并发线程数固定为3
          REG_THREADS: "3"
          FRONT_IP: ${{ github.event.inputs.front_ip || '8.138.198.37' }}
          UPLOAD_TO_API: "true"
          API_TOKEN: ${{ secrets.API_TOKEN }}
          PROXY: ${{ secrets.PROXY }}
          MAIL_API_URL: ${{ secrets.MAIL_API_URL }}
          MAIL_DOMAINS: ${{ secrets.MAIL_DOMAINS }}
          PREFIX: ${{ secrets.PREFIX }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python app/main.py

      - name: 上传日志产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}-job${{ matrix.job_index }}
          path: app/logs/
          retention-days: 7
